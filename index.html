<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日系隨身行程 App</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --morandi-blue: #93A9B5;
            --snow-white: #F9F9F9;
            --warm-gray: #E0DCD9;
            --text-main: #555E64;
            --text-light: #8E979C;
            --card-bg: #FFFFFF;
            --tag-eat: #E9C6C1;
            --tag-photo: #F3E2C3;
            --tag-buy: #D0D9C5;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body {
            margin: 0; padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--snow-white);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* 編輯狀態提示 */
        [contenteditable="true"]:focus {
            background-color: rgba(147, 169, 181, 0.1);
            border-radius: 4px;
        }

        header { padding: 50px 25px 15px; background: #fff; }
        .trip-title { font-size: 24px; font-weight: 700; margin: 0; }
        .trip-date { font-size: 14px; color: var(--morandi-blue); margin-top: 5px; }

        /* Tabs & Day Selector */
        .tabs-container { display: flex; padding: 0 25px; gap: 20px; margin: 15px 0; }
        .tab { font-size: 16px; font-weight: 500; color: var(--text-light); cursor: pointer; padding-bottom: 8px; }
        .tab.active { color: var(--morandi-blue); border-bottom: 3px solid var(--morandi-blue); }

        .day-selector {
            display: flex; gap: 12px; padding: 10px 25px;
            overflow-x: auto; white-space: nowrap;
        }
        .day-btn {
            min-width: 55px; padding: 10px; border-radius: 18px;
            background: #fff; border: 1px solid var(--warm-gray);
            text-align: center; cursor: pointer;
        }
        .day-btn.active { background: var(--morandi-blue); color: #fff; border-color: var(--morandi-blue); }

        /* 內容區 */
        .content-section { padding: 0 15px 120px; display: none; }
        .content-section.active { display: block; animation: fadeIn 0.3s ease; }

        /* 景點卡片 */
        .card {
            background: var(--card-bg); border-radius: 28px;
            padding: 20px; margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            border: 1px solid rgba(224, 220, 217, 0.5);
            position: relative;
        }
        .cat-badge {
            display: inline-block; padding: 2px 10px; border-radius: 8px;
            font-size: 11px; background: var(--morandi-blue); color: white; margin-bottom: 10px;
        }
        .nav-btn {
            position: absolute; top: 20px; right: 20px;
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--snow-white); display: flex; align-items: center; justify-content: center;
            color: var(--morandi-blue); border: 1px solid var(--warm-gray);
        }

        .color-tag {
            display: inline-block; padding: 3px 12px; border-radius: 50px;
            font-size: 11px; font-weight: 500; margin-right: 5px; margin-top: 10px;
        }
        .tag-eat { background: var(--tag-eat); color: #8A5A55; }
        .tag-photo { background: var(--tag-photo); color: #8D7A55; }

        .info-box {
            margin-top: 15px; padding: 12px; border-radius: 15px; font-size: 13px;
        }
        .box-tips { background: #FFF9F0; color: #8D7A55; }
        .box-parking { background: #F5F7F8; color: var(--text-light); }

        .photo-area {
            display: flex; gap: 10px; margin-top: 15px; align-items: center;
        }
        .photo-box {
            width: 60px; height: 60px; border-radius: 12px; border: 1px dashed var(--warm-gray);
            display: flex; align-items: center; justify-content: center; background-size: cover;
        }

        /* 底部資訊區 */
        .footer-advice {
            margin-top: 20px; padding: 20px; background: #fff; border-radius: 24px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            border: 1px solid var(--warm-gray);
        }
        .advice-item h4 { margin: 0 0 5px 0; font-size: 12px; color: var(--morandi-blue); }
        .advice-item p { margin: 0; font-size: 12px; }

        /* 浮動按鈕與導覽 */
        .fab {
            position: fixed; bottom: 100px; right: 25px;
            width: 56px; height: 56px; background: var(--morandi-blue);
            color: white; border-radius: 50%; border: none; font-size: 24px; z-index: 99;
        }
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; height: 65px; background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px); border-radius: 35px;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1000;
        }
        .nav-item { color: var(--text-light); font-size: 20px; text-decoration: none; }
        .nav-item.active { color: var(--morandi-blue); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

    </header>

        <div class="tab" onclick="switchMainTab('notes')">旅遊筆記</div>
    </div>
