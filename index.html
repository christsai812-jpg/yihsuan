<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>胡志明市初遊 - 行程管家</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --morandi-blue: #7A96A6;
            --snow-white: #F9F9F9;
            --warm-gray: #E0DCD9;
            --text-main: #555E64;
            --text-light: #8E979C;
            --card-bg: #FFFFFF;
            --tag-eat: #F4D0C9;
            --tag-buy: #D7E0CC;
            --tag-photo: #F5E6CC;
            --danger-red: #E29792;
            --timeline-color: #B5C9D3;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--snow-white);
            color: var(--text-main);
            background-image: radial-gradient(var(--warm-gray) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            -webkit-user-select: none; user-select: none;
        }

        [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
        [contenteditable="true"]:focus { background-color: rgba(122, 150, 166, 0.1); border-radius: 4px; }

        /* ================= Header & 主分頁 ================= */
        header {
            padding: 45px 20px 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(224, 220, 217, 0.5);
        }
        .trip-title { font-size: 22px; font-weight: 700; margin: 0; color: var(--text-main); }
        .trip-date { font-size: 13px; color: var(--morandi-blue); margin-top: 5px; font-weight: 500; }

        .main-tabs {
            display: flex; gap: 25px; margin-top: 15px;
        }
        .m-tab { 
            font-size: 15px; color: var(--text-light); cursor: pointer; 
            padding-bottom: 10px; position: relative; font-weight: 500;
        }
        .m-tab.active { color: var(--morandi-blue); font-weight: 700; }
        .m-tab.active::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
            background: var(--morandi-blue); border-radius: 10px 10px 0 0;
        }

        /* ================= 內容區塊控制 ================= */
        .content-section { display: none; padding: 15px 20px 130px; }
        .content-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= 行程頁：天數切換與每日卡片 ================= */
        .day-switcher {
            display: flex; gap: 10px; overflow-x: auto; 
            padding: 5px 0 15px; scrollbar-width: none;
        }
        .day-switcher::-webkit-scrollbar { display: none; }
        .day-btn {
            min-width: 65px; height: 75px; border-radius: 14px;
            background: var(--card-bg); border: 1px solid var(--warm-gray);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0; transition: all 0.2s; color: var(--text-light);
        }
        .day-btn.active {
            background: var(--morandi-blue); color: white; border-color: var(--morandi-blue);
            box-shadow: 0 4px 12px rgba(122, 150, 166, 0.3);
        }
        .day-btn span { font-size: 12px; pointer-events: none; margin-bottom: 2px; }
        .day-btn b { font-size: 18px; pointer-events: none; }

        .daily-info-card {
            background: var(--card-bg); border-radius: 16px; padding: 16px;
            border: 1px solid var(--warm-gray); display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .daily-info-left h2 { margin: 0 0 5px; font-size: 18px; color: var(--text-main); }
        .daily-info-left p { margin: 0; font-size: 13px; color: var(--text-light); }
        .daily-info-right { text-align: right; }
        .daily-info-right .weather { font-size: 16px; font-weight: 700; color: var(--morandi-blue); margin-bottom: 5px; display: block; }
        .daily-info-right .loc { font-size: 12px; color: var(--text-light); }

        /* ================= 行程頁：時間軸與景點卡片 ================= */
        .timeline-container {
            border-left: 2px solid var(--timeline-color);
            padding-left: 20px; margin-left: 10px;
        }
        .spot-card {
            background: var(--card-bg); border-radius: 16px;
            padding: 16px; margin-bottom: 20px;
            border: 1px solid rgba(224, 220, 217, 0.8);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); position: relative;
        }
        .spot-card::before {
            content: ''; position: absolute; left: -26px; top: 20px;
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--morandi-blue); border: 2px solid var(--snow-white);
        }

        .card-top { display: flex; gap: 12px; align-items: flex-start; }
        .time-cat-box { display: flex; flex-direction: column; gap: 8px; width: 68px; flex-shrink: 0; }
        .time-input {
            width: 100%; border: none; font-family: inherit; font-size: 14px; 
            font-weight: 700; color: var(--text-main); text-align: center;
            background: #F0F4F5; border-radius: 8px; padding: 4px;
        }
