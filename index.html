<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>胡志明市初遊 - Travel Designer</title>
    <!-- 引入日式圓體字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --morandi-blue: #93A9B5;
            --snow-white: #F9F9F9;
            --warm-gray: #E0DCD9;
            --text-main: #555E64;
            --text-light: #8E979C;
            --card-bg: #FFFFFF;
            /* 標籤色系 */
            --tag-eat: #E9C6C1;
            --tag-buy: #D0D9C5;
            --tag-photo: #F3E2C3;
            --accent-soft: #D9D2C5;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--snow-white);
            color: var(--text-main);
            /* 日式文青底紋 */
            background-image: radial-gradient(var(--warm-gray) 0.5px, transparent 0.5px);
            background-size: 25px 25px;
            line-height: 1.6;
        }

        /* 內容編輯時的視覺回饋 */
        [contenteditable="true"]:focus {
            background-color: rgba(147, 169, 181, 0.1);
            border-radius: 8px;
            padding: 2px 5px;
        }

        /* ================= Header ================= */
        header {
            padding: 55px 25px 15px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(224, 220, 217, 0.5);
        }
        .trip-title { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: 1px; }
        .trip-date { font-size: 14px; color: var(--morandi-blue); margin-top: 5px; font-weight: 500; cursor: pointer; }

        .header-actions {
            position: absolute; right: 25px; top: 55px;
            display: flex; gap: 12px;
        }
        .header-btn {
            background: var(--snow-white); border: 1px solid var(--warm-gray); border-radius: 12px;
            width: 36px; height: 36px; color: var(--morandi-blue);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        .main-tabs { display: flex; gap: 25px; margin-top: 20px; }
        .m-tab { 
            font-size: 16px; color: var(--text-light); cursor: pointer; 
            padding-bottom: 8px; position: relative; font-weight: 500;
        }
        .m-tab.active { color: var(--morandi-blue); font-weight: 700; }
        .m-tab.active::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3.5px;
            background: var(--morandi-blue); border-radius: 10px;
        }

        /* ================= 行程內容控制區 ================= */
        .content-section { display: none; padding: 20px 20px 140px; }
        .content-section.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 天數切換器 */
        .day-switcher {
            display: flex; gap: 12px; overflow-x: auto; 
            padding: 5px 0 20px; scrollbar-width: none;
        }
        .day-switcher::-webkit-scrollbar { display: none; }
        .day-btn {
            min-width: 65px; height: 80px; border-radius: 20px;
            background: var(--card-bg); border: 1px solid var(--warm-gray);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0; transition: 0.3s;
        }
        .day-btn.active {
            background: var(--morandi-blue); color: white; border-color: var(--morandi-blue);
            box-shadow: 0 8px 18px rgba(147, 169, 181, 0.3);
        }
        .day-btn span { font-size: 10px; text-transform: uppercase; margin-bottom: 4px; }
        .day-btn b { font-size: 20px; }

        /* 景點卡片系統 */
        .spot-card {
            background: var(--card-bg); border-radius: 24px; padding: 22px; margin-bottom: 20px;
            border: 1px solid rgba(224, 220, 217, 0.5); box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            position: relative; overflow: hidden;
        }

        /* 導航與分類按鈕 */
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .cat-badge {
            background: var(--morandi-blue); color: white; padding: 4px 12px;
            border-radius: 10px; font-size: 11px; font-weight: 700;
        }
        .nav-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--snow-white); color: var(--morandi-blue);
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--warm-gray); cursor: pointer;
        }

        .spot-title { font-size: 19px; font-weight: 700; margin: 0 0 8px; color: var(--text-main); }
        .spot-desc { font-size: 14px; color: var(--text-light); margin: 0 0 15px; }

        /* 彩色標籤列 */
        .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
        .c-tag { 
            padding: 4px 14px; border-radius: 50px; font-size: 12px; font-weight: 700; 
            border: none; cursor: text;
        }
        .tag-eat { background: var(--tag-eat); color: #8A5A55; }
        .tag-buy { background: var(--tag-buy); color: #5D6B50; }
        .tag-photo { background: var(--tag-photo); color: #8D7A55; }

        /* 停車資訊與拍照小技巧 */
        .info-panel {
            background: #F8F9F9; border-radius: 16px; padding: 15px; margin-top: 15px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .info-item { display: flex; gap: 10px; font-size: 13px; align-items: flex-start; }
        .info-item i { color: var(--morandi-blue); margin-top: 3px; width: 15px; text-align: center; }
        .info-item b { color: var(--text-main); }

        /* 旅記照片上傳 */
        .photo-upload {
            margin-top: 18px; border-top: 1px dashed var(--warm-gray); padding-top: 18px;
        }
        .upload-trigger {
            display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
            color: var(--morandi-blue); cursor: pointer; font-weight: 700;
        }
        .upload-trigger input { display: none; }
        .journal-img { 
            width: 100%; border-radius: 16px; margin-top: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: none;
        }

        /* 每日穿搭與天氣提示 */
        .daily-advice {
            background: var(--accent-soft); border-radius: 24px; padding: 20px;
            margin-top: 30px; display: flex; flex-direction: column; gap: 12px;
            color: #726A5E; border: 1px solid rgba(0,0,0,0.05);
        }
        .advice-item { display: flex; gap: 12px; align-items: center; }
        .advice-item i { font-size: 18px; width: 25px; text-align: center; }
        .advice-item span { font-size: 14px; font-weight: 700; }
        .advice-item p { margin: 0; font-size: 14px; flex: 1; }

        /* 底部導覽列 */
        .bottom-nav {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 70px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-radius: 35px; display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1); z-index: 2000;
            border: 1px solid rgba(224, 220, 217, 0.5);
        }
        .nav-item { color: var(--text-light); font-size: 22px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--morandi-blue); transform: translateY(-5px); }

        .add-btn {
            position: fixed; bottom: 120px; right: 25px;
            width: 58px; height: 58px; background: var(--morandi-blue);
            color: white; border-radius: 50%; border: none; font-size: 24px;
            box-shadow: 0 8px 20px rgba(147, 169, 181, 0.4); z-index: 1500;
        }

        .del-card-btn { color: #eee; font-size: 12px; position: absolute; bottom: 15px; right: 20px; cursor: pointer; }
        .del-card-btn:hover { color: #E29792; }

    </style>
</head>
<body>

    <header>
        <h1 class="trip-title" contenteditable="true" id="app-title">胡志明市初遊</h1>
        <div class="trip-date" contenteditable="true" id="app-date" title="點擊修改開始日期自動推算">2024.11.20 - 11.27</div>
        
        <div class="header-actions">
            <button class="header-btn" onclick="exportData()"><i class="fas fa-paper-plane"></i></button>
            <button class="header-btn" onclick="importData()"><i class="fas fa-download"></i></button>
        </div>
        
        <div class="main-tabs">
            <div id="tab-itinerary-btn" class="m-tab active" onclick="switchTab('itinerary')">行程頁</div>
            <div id="tab-guide-btn" class="m-tab" onclick="switchTab('guide')">指南</div>
            <div id="tab-weather-btn" class="m-tab" onclick="switchTab('weather')">天氣</div>
        </div>
    </header>

    <!-- 行程分頁 -->
    <div id="itinerary" class="content-section active">
        <!-- 每日選擇切換 -->
        <div class="day-switcher" id="day-switcher"></div>

        <div style="padding: 10px 5px 20px;">
            <h2 id="day-title-display" contenteditable="true" style="margin:0; font-size: 20px; letter-spacing: 1px;">11/20 西貢經典巡禮</h2>
            <div style="font-size: 13px; color: var(--morandi-blue); margin-top: 5px;">
                <i class="fas fa-map-marker-alt"></i> <span contenteditable="true" id="day-loc-display">第一郡 · 歷史區</span>
            </div>
        </div>

        <div id="spot-list">
            <!-- 景點卡片動態載入 -->
        </div>

        <div class="daily-advice">
            <div class="advice-item">
                <i class="fas fa-tshirt"></i> <span>穿著</span>
                <p id="sum-outfit" contenteditable="true">棉麻材質、好走的球鞋</p>
            </div>
            <div class="advice-item">
                <i class="fas fa-cloud-sun"></i> <span>天氣</span>
                <p id="sum-weather" contenteditable="true">午後可能有短暫雷雨</p>
            </div>
        </div>
    </div>

    <!-- 指南分頁 -->
    <div id="guide" class="content-section">
        <div class="spot-card">
            <h3 contenteditable="true">📌 行前備忘錄</h3>
            <p contenteditable="true" style="font-size: 14px; line-height: 1.8;">
                1. E-visa 電子簽證務必列印紙本兩份備用。<br>
                2. 手機提前下載 Grab 並綁定好信用卡。<br>
                3. 推薦換匯：濱城市場對面金店。<br>
                4. 腸胃藥與防蚊液是必備品。
            </p>
        </div>
    </div>

    <!-- 天氣分頁 -->
    <div id="weather" class="content-section">
        <div class="spot-card" style="text-align: center; padding: 50px 20px;">
            <i class="fas fa-sun" style="font-size: 50px; color: #E5B96B;"></i>
            <h2 style="font-size: 36px; margin: 15px 0;">32°C</h2>
            <p style="color: var(--text-light);">胡志明市 · 今日晴朗</p>
        </div>
    </div>

    <button class="add-btn" onclick="addNewSpot()"><i class="fas fa-plus"></i></button>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('itinerary')"><i class="fas fa-map-marked-alt"></i></div>
        <div class="nav-item" onclick="switchTab('guide')"><i class="fas fa-bookmark"></i></div>
        <div class="nav-item" onclick="alert('旅程照片集開發中')"><i class="fas fa-camera"></i></div>
        <div class="nav-item" onclick="alert('個人檔案')"><i class="fas fa-user-circle"></i></div>
    </nav>

    <script>
        // 初始化資料結構
        let travelData = JSON.parse(localStorage.getItem('hcm_travel_v9')) || {
            currentDay: 0,
            days: [
                {
                    dateStr: "11/20", title: "11/20 西貢經典巡禮", loc: "第一郡 · 歷史區", outfit: "棉麻材質、球鞋", weather: "午後短暫陣雨",
                    spots: [
                        { cat: "景點", name: "胡志明市中央郵局", desc: "法式建築經典，必寄明信片。", tags: ["#必拍煤油燈感", "#必拍對稱大廳"], tips: "下午三點的光線最溫潤。", parking: "機車可停靠隔壁書街旁。", img: "" },
                        { cat: "食物", name: "Phở Hòa Pasteur", desc: "百年老字號河粉，湯頭鮮美。", tags: ["#必吃牛雜粉", "#必吃油條"], tips: "河粉配油條是道地吃法。", parking: "店門口提供代客泊車。", img: "" }
                    ]
                },
                { dateStr: "11/21", title: "11/21 文青咖啡之日", loc: "第三郡 · 咖啡公寓", outfit: "適合拍照的洋裝", weather: "晴朗熱", spots: [] }
            ]
        };

        window.onload = function() {
            document.getElementById('app-title').innerText = localStorage.getItem('hcm_title_v9') || "胡志明市初遊";
            document.getElementById('app-date').innerText = localStorage.getItem('hcm_date_v9') || "2024.11.20 - 11.27";
            renderDaySwitcher(); renderContent();
        };

        // 分頁切換
        function switchTab(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.m-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'itinerary') {
                document.getElementById('tab-itinerary-btn').classList.add('active');
                document.querySelector('.nav-item:nth-child(1)').classList.add('active');
            } else if(id === 'guide') {
                document.getElementById('tab-guide-btn').classList.add('active');
                document.querySelector('.nav-item:nth-child(2)').classList.add('active');
            }
        }

        // 渲染天數按鈕
        function renderDaySwitcher() {
            const container = document.getElementById('day-switcher'); container.innerHTML = '';
            travelData.days.forEach((day, idx) => {
                const btn = document.createElement('div');
                btn.className = `day-btn ${travelData.currentDay === idx ? 'active' : ''}`;
                btn.innerHTML = `<span>Day</span><b>${idx + 1}</b>`;
                btn.onclick = () => { travelData.currentDay = idx; renderDaySwitcher(); renderContent(); };
                container.appendChild(btn);
            });
        }

        // 渲染行程卡片
        function renderContent() {
            const day = travelData.days[travelData.currentDay];
            document.getElementById('day-title-display').innerText = day.title;
            document.getElementById('day-loc-display').innerText = day.loc;
            document.getElementById('sum-outfit').innerText = day.outfit;
            document.getElementById('sum-weather').innerText = day.weather;

            const list = document.getElementById('spot-list'); list.innerHTML = '';
            day.spots.forEach((spot, sIdx) => {
                const card = document.createElement('div'); card.className = 'spot-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="cat-badge" contenteditable="true" onblur="updateSpot(${sIdx}, 'cat', this.innerText)">${spot.cat}</span>
                        <div class="nav-btn" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.name)}')">
                            <i class="fas fa-location-arrow"></i>
                        </div>
                    </div>
                    <h3 class="spot-title" contenteditable="true" onblur="updateSpot(${sIdx}, 'name', this.innerText)">${spot.name}</h3>
                    <p class="spot-desc" contenteditable="true" onblur="updateSpot(${sIdx}, 'desc', this.innerText)">${spot.desc}</p>
                    
                    <div class="tag-row">
                        ${(spot.tags || []).map((t, tIdx) => {
                            let type = t.includes('吃') ? 'tag-eat' : t.includes('買') ? 'tag-buy' : 'tag-photo';
                            return `<span class="c-tag ${type}" contenteditable="true" onblur="updateTag(${sIdx}, ${tIdx}, this.innerText)">${t}</span>`;
                        }).join('')}
                        <span style="font-size:12px; color:var(--morandi-blue); cursor:pointer;" onclick="addTag(${sIdx})">+ 標籤</span>
                    </div>

                    <div class="info-panel">
                        <div class="info-item">
                            <i class="fas fa-camera"></i>
                            <div><b>拍照小技巧：</b><span contenteditable="true" onblur="updateSpot(${sIdx}, 'tips', this.innerText)">${spot.tips}</span></div>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-parking"></i>
                            <div><b>停車資訊：</b><span contenteditable="true" onblur="updateSpot(${sIdx}, 'parking', this.innerText)">${spot.parking}</span></div>
                        </div>
                    </div>

                    <div class="photo-upload">
                        <label class="upload-trigger">
                            <i class="fas fa-image"></i> ${spot.img ? '更換照片' : '點擊上傳旅記照片'}
                            <input type="file" accept="image/*" onchange="uploadPhoto(event, ${sIdx})">
                        </label>
                        <img src="${spot.img}" class="journal-img" style="display: ${spot.img ? 'block' : 'none'}">
                    </div>

                    <div class="del-card-btn" onclick="deleteSpot(${sIdx})"><i class="fas fa-times"></i> 刪除項目</div>
                `;
                list.appendChild(card);
            });
            save();
        }

        // CRUD 功能
        function updateSpot(idx, key, val) { travelData.days[travelData.currentDay].spots[idx][key] = val; save(); }
        function updateTag(sIdx, tIdx, val) { travelData.days[travelData.currentDay].spots[sIdx].tags[tIdx] = val; save(); }
        function addTag(sIdx) { travelData.days[travelData.currentDay].spots[sIdx].tags.push("#新標籤"); renderContent(); }
        function addNewSpot() {
            travelData.days[travelData.currentDay].spots.push({ cat: "景點", name: "新景點名稱", desc: "請輸入介紹...", tags: ["#必拍"], tips: "無提示", parking: "無資訊", img: "" });
            renderContent();
        }
        function deleteSpot(idx) { if(confirm('確定刪除此行程？')) { travelData.days[travelData.currentDay].spots.splice(idx, 1); renderContent(); } }
        
        function uploadPhoto(e, sIdx) {
            const reader = new FileReader();
            reader.onload = function() { travelData.days[travelData.currentDay].spots[sIdx].img = reader.result; renderContent(); };
            reader.readAsDataURL(e.target.files[0]);
        }

        function save() {
            localStorage.setItem('hcm_travel_v9', JSON.stringify(travelData));
            localStorage.setItem('hcm_title_v9', document.getElementById('app-title').innerText);
            localStorage.setItem('hcm_date_v9', document.getElementById('app-date').innerText);
        }

        // 監聽基本資訊修改
        ['day-title-display', 'day-loc-display', 'sum-outfit', 'sum-weather', 'app-title', 'app-date'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.onblur = function() {
                const day = travelData.days[travelData.currentDay];
                if(id === 'day-title-display') day.title = this.innerText;
                if(id === 'day-loc-display') day.loc = this.innerText;
                if(id === 'sum-outfit') day.outfit = this.innerText;
                if(id === 'sum-weather') day.weather = this.innerText;
                save();
            };
        });

        // 匯出/匯入 (邏輯同你提供的代碼)
        function exportData() {
            const code = btoa(unescape(encodeURIComponent(JSON.stringify(travelData))));
            prompt("請複製此行程代碼分享給好友：", code);
        }
        function importData() {
            const code = prompt("請貼上行程代碼：");
            if(code) {
                travelData = JSON.parse(decodeURIComponent(escape(atob(code))));
                renderDaySwitcher(); renderContent(); save();
            }
        }
    </script>
</body>
</html>
