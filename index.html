<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>胡志明市初遊 - 行程管家</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --morandi-blue: #7A96A6;
            --snow-white: #F9F9F9;
            --warm-gray: #E0DCD9;
            --text-main: #555E64;
            --text-light: #8E979C;
            --card-bg: #FFFFFF;
            --tag-eat: #F4D0C9;
            --tag-buy: #D7E0CC;
            --tag-photo: #F5E6CC;
            --danger-red: #E29792;
            --timeline-color: #B5C9D3;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--snow-white);
            color: var(--text-main);
            background-image: radial-gradient(var(--warm-gray) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            -webkit-user-select: none; user-select: none;
        }

        [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
        [contenteditable="true"]:focus { background-color: rgba(122, 150, 166, 0.1); border-radius: 4px; }
        [contenteditable="true"].trip-date:focus { background-color: rgba(122, 150, 166, 0.1); border-radius: 4px; padding: 2px 4px; margin-left: -4px; }

        /* ================= Header & 主分頁 ================= */
        header {
            padding: 45px 20px 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(224, 220, 217, 0.5);
        }
        .trip-title { font-size: 22px; font-weight: 700; margin: 0; color: var(--text-main); max-width: 75%; }
        .trip-date { font-size: 13px; color: var(--morandi-blue); margin-top: 5px; font-weight: 500; display: inline-block; cursor: text; }

        /* 右上角分享與匯入按鈕 */
        .header-actions {
            position: absolute; right: 20px; top: 45px;
            display: flex; gap: 10px;
        }
        .header-btn {
            background: #F0F4F5; border: none; border-radius: 8px;
            width: 32px; height: 32px; color: var(--morandi-blue);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
