<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>胡志明市初遊 - Travel Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --morandi-blue: #93A9B5;
            --snow-white: #F9F9F9;
            --warm-gray: #E0DCD9;
            --text-main: #555E64;
            --text-light: #8E979C;
            --card-bg: #FFFFFF;
            /* 彩色標籤配色 */
            --tag-eat: #E9C6C1;
            --tag-buy: #D0D9C5;
            --tag-photo: #F3E2C3;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--snow-white);
            color: var(--text-main);
            background-image: radial-gradient(var(--warm-gray) 0.5px, transparent 0.5px);
            background-size: 30px 30px;
            overflow-x: hidden;
        }

        [contenteditable="true"]:focus {
            background-color: rgba(147, 169, 181, 0.08);
            border-radius: 8px;
        }

        /* Header */
        header {
            padding: 50px 25px 15px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
        }
        .trip-title { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: 1px; }
        .trip-date { font-size: 14px; color: var(--morandi-blue); margin-top: 4px; }

        /* Main Tabs */
        .main-tabs {
            display: flex; padding: 0 25px; gap: 20px; margin: 15px 0;
        }
        .m-tab { 
            font-size: 16px; color: var(--text-light); cursor: pointer; padding-bottom: 5px; 
            transition: 0.3s; border-bottom: 2px solid transparent;
        }
        .m-tab.active { color: var(--morandi-blue); border-bottom-color: var(--morandi-blue); font-weight: 700; }

        /* Day Selector (每日選擇切換) */
        .day-scroller {
            display: flex; gap: 12px; padding: 10px 25px;
            overflow-x: auto; scrollbar-width: none;
        }
        .day-scroller::-webkit-scrollbar { display: none; }
        .day-card-btn {
            min-width: 65px; height: 75px; border-radius: 22px;
            background: var(--card-bg); border: 1px solid var(--warm-gray);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; flex-shrink: 0;
        }
        .day-card-btn.active {
            background: var(--morandi-blue); color: white; border-color: var(--morandi-blue);
            box-shadow: 0 6px 15px rgba(147, 169, 181, 0.3);
        }
        .day-card-btn span { font-size: 10px; text-transform: uppercase; margin-bottom: 2px; }
        .day-card-btn b { font-size: 18px; }

        /* Content Area */
        .content-section { padding: 0 18px 120px; display: none; }
        .content-section.active { display: block; animation: fadeIn 0.4s ease; }

        /* 每日資訊 Header (日期+地點) */
        .day-info-header { padding: 15px 10px; }
        .day-info-header h2 { margin: 0; font-size: 20px; color: var(--text-main); }
        .day-location { font-size: 13px; color: var(--morandi-blue); margin-top: 4px; }

        /* 景點卡片 */
        .spot-card {
            background: var(--card-bg); border-radius: 28px;
            padding: 22px; margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.02);
            border: 1px solid rgba(224, 220, 217, 0.4);
            position: relative;
        }

        /* 景點分類徽章 */
        .spot-cat {
            display: inline-block; padding: 3px 12px; border-radius: 10px;
            font-size: 11px; background: var(--morandi-blue); color: white;
            margin-bottom: 12px; font-weight: 500;
        }

        /* 導航按鈕 */
        .btn-nav {
            position: absolute; top: 22px; right: 22px;
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--snow-white); color: var(--morandi-blue);
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; border: 1px solid var(--warm-gray);
        }

        /* 彩色標籤 */
        .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
        .c-badge { padding: 4px 12px; border-radius: 50px; font-size: 11px; font-weight: 700; }
        .c-eat { background: var(--tag-eat); color: #8A5A55; }
        .c-buy { background: var(--tag-buy); color: #5D6B50; }
        .c-photo { background: var(--tag-photo); color: #8D7A55; }

        /* 資訊區塊 (停車/技巧) */
        .info-block {
            margin-top: 15px; padding: 12px; border-radius: 15px; font-size: 13px; line-height: 1.5;
        }
        .block-tips { background: #FFF9F0; color: #8D7A55; border: 1px solid #F3E2C3; }
        .block-parking { background: #F5F7F8; color: var(--text-light); border: 1px solid var(--warm-gray); }

        /* 照片上傳旅記 */
        .journal-photo {
            width: 100%; height: 160px; border-radius: 20px;
            background: #F2F2F2; border: 1.5px dashed var(--warm-gray);
            margin-top: 15px; display: flex; align-items: center; justify-content: center;
            overflow: hidden; background-size: cover; background-position: center;
            color: var(--text-light); flex-direction: column; cursor: pointer;
        }

        /* 建議穿著與天氣提示 (每日底部) */
        .daily-advice {
            background: linear-gradient(135deg, #fff 0%, var(--snow-white) 100%);
            border-radius: 26px; padding: 20px; margin-top: 10px;
            border: 1px solid var(--warm-gray); display: flex; gap: 15px;
        }
        .advice-box { flex: 1; }
        .advice-box h4 { margin: 0 0 5px; font-size: 12px; color: var(--morandi-blue); text-transform: uppercase; }
        .advice-box p { margin: 0; font-size: 13px; color: var(--text-main); }

        /* 底部浮動導覽條 */
        .bottom-nav {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 68px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            border-radius: 35px; display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1); z-index: 1000;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .nav-item { color: var(--text-light); font-size: 22px; transition: 0.3s; }
        .nav-item.active { color: var(--morandi-blue); transform: translateY(-3px); }

        .add-spot-btn {
            position: fixed; bottom: 110px; right: 25px;
            width: 54px; height: 54px; background: var(--morandi-blue);
            color: white; border-radius: 50%; border: none; font-size: 22px;
            box-shadow: 0 5px 15px rgba(147, 169, 181, 0.4); z-index: 99;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <h1 class="trip-title" contenteditable="true" id="app-title">胡志明市初遊</h1>
        <div class="trip-date" contenteditable="true" id="app-date">2024.11.20 - 11.24 · 5 Days</div>
    </header>

    <!-- 行程頁面 -->
    <div id="itinerary" class="content-section active">

                <div class="advice-box">

                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">

        <a href="#" class="nav-item"><i class="fas fa-camera-retro"></i></a>
        <a href="#" class="nav-item"><i class="fas fa-user-circle"></i></a>
    </nav>

    <button class="add-spot-btn" onclick="addNewSpot()"><i class="fas fa-plus"></i></button>
